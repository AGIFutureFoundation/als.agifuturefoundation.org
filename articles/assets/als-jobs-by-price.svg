<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-label="Bar chart of the six ALS Researcher jobs by price, with SLAs">
  <rect width="760" height="430" fill="#f6f7f9"/>
  <text x="30" y="34" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0b1e3a">ALS Researcher — the six jobs, by price</text>
  <text x="30" y="56" font-family="system-ui, sans-serif" font-size="13" fill="#4a5a6d">Fixed USD price per job, with the listed turnaround (SLA). One subscription exists separately: library_weekly, $25 per 30 days.</text>
  <!-- rows: label x=30, bar starts x=210, scale: $150 = 420px => 2.8 px per $ -->
  <g font-family="system-ui, sans-serif" font-size="13" fill="#14202e">
    <text x="30" y="102">compound_lookup</text>
    <rect x="210" y="88" width="6" height="20" fill="#0e7c7b"/>
    <text x="224" y="103" font-weight="700">$2 · 30 min</text>
    <text x="30" y="142">compound_library_snapshot</text>
    <rect x="210" y="128" width="28" height="20" fill="#0e7c7b"/>
    <text x="246" y="143" font-weight="700">$10 · 24 h</text>
    <text x="30" y="182">library_growth_report</text>
    <rect x="210" y="168" width="42" height="20" fill="#0e7c7b"/>
    <text x="260" y="183" font-weight="700">$15 · 48 h</text>
    <text x="30" y="222">compound_research_report</text>
    <rect x="210" y="208" width="70" height="20" fill="#0e7c7b"/>
    <text x="288" y="223" font-weight="700">$25 · 48 h</text>
    <text x="30" y="262">compound_data_access</text>
    <rect x="210" y="248" width="140" height="20" fill="#0e7c7b"/>
    <text x="358" y="263" font-weight="700">$50 · 24 h</text>
    <text x="30" y="302">compound_screening_pack</text>
    <rect x="210" y="288" width="420" height="20" fill="#c9a227"/>
    <text x="638" y="303" font-weight="700">$150 · 72 h</text>
  </g>
  <line x1="210" y1="320" x2="630" y2="320" stroke="#e3e7ec" stroke-width="1"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#4a5a6d">
    <text x="210" y="338">$0</text>
    <text x="350" y="338">$50</text>
    <text x="490" y="338">$100</text>
    <text x="620" y="338">$150</text>
  </g>
  <text x="30" y="372" font-family="system-ui, sans-serif" font-size="12" fill="#4a5a6d">Source: ALS Researcher job catalog on Virtuals Protocol (ACP), as recorded 2026-11-06;</text>
  <text x="30" y="390" font-family="system-ui, sans-serif" font-size="12" fill="#4a5a6d">see als.agifuturefoundation.org/jobs.html. Require Funds is on for every job.</text>
  <text x="30" y="412" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0b1e3a">Status: the agent is OFFLINE — no instance is deployed, so no hire can be fulfilled today.</text>
</svg>
