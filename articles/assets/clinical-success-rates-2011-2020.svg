<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-label="Bar chart of clinical development success rates by phase, BIO Informa QLS 2011-2020">
  <rect width="760" height="460" fill="#f6f7f9"/>
  <text x="30" y="34" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0b1e3a">Clinical development success rates, 2011–2020</text>
  <text x="30" y="56" font-family="system-ui, sans-serif" font-size="13" fill="#4a5a6d">Share of drug development programs that passed each gate. Phase II is the hardest gate.</text>
  <!-- vertical bars: chart area y 90..330 (240px = 100%), bar width 90, x positions -->
  <g font-family="system-ui, sans-serif" font-size="13" fill="#14202e">
    <rect x="60" y="205" width="90" height="125" fill="#0e7c7b"/>
    <text x="105" y="195" text-anchor="middle" font-weight="700">52.0%</text>
    <rect x="200" y="261" width="90" height="69" fill="#c9a227"/>
    <text x="245" y="251" text-anchor="middle" font-weight="700">28.9%</text>
    <rect x="340" y="191" width="90" height="139" fill="#0e7c7b"/>
    <text x="385" y="181" text-anchor="middle" font-weight="700">57.8%</text>
    <rect x="480" y="113" width="90" height="217" fill="#0e7c7b"/>
    <text x="525" y="103" text-anchor="middle" font-weight="700">90.6%</text>
    <rect x="620" y="311" width="90" height="19" fill="#0b1e3a"/>
    <text x="665" y="301" text-anchor="middle" font-weight="700">7.9%</text>
  </g>
  <line x1="30" y1="330" x2="730" y2="330" stroke="#0b1e3a" stroke-width="1.5"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#14202e">
    <text x="105" y="348" text-anchor="middle">Phase I → II</text>
    <text x="245" y="348" text-anchor="middle">Phase II → III</text>
    <text x="385" y="348" text-anchor="middle">Phase III → filing</text>
    <text x="525" y="348" text-anchor="middle">Filing → approval</text>
    <text x="665" y="348" text-anchor="middle">Phase I → approval</text>
    <text x="665" y="364" text-anchor="middle">(overall)</text>
  </g>
  <text x="30" y="398" font-family="system-ui, sans-serif" font-size="12" fill="#4a5a6d">Source: BIO / Informa Pharma Intelligence / QLS Advisors, “Clinical Development Success Rates</text>
  <text x="30" y="416" font-family="system-ui, sans-serif" font-size="12" fill="#4a5a6d">and Contributing Factors 2011–2020” — 12,728 phase transitions from 9,704 programs. Average time</text>
  <text x="30" y="434" font-family="system-ui, sans-serif" font-size="12" fill="#4a5a6d">from Phase I to approval in the same study: 10.5 years. Rates are industry-wide, all diseases.</text>
</svg>
